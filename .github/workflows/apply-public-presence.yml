name: Finalize public academic presence

# Temporary one-shot workflow; removed before merge.
on:
  push:
    branches: [feat/public-academic-presence]
    paths:
      - scripts/finalize_public_presence.py
      - .github/workflows/apply-public-presence.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out working branch
        uses: actions/checkout@v6
        with:
          ref: feat/public-academic-presence

      - name: Finalize public presence
        run: python scripts/finalize_public_presence.py

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/convertir.html docs/academia.html docs/site.webmanifest README.md scripts/validate_public_presence.py .github/workflows/validate.yml
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Finalizar identidad y presencia pública"
            git push origin HEAD:feat/public-academic-presence
          fi
