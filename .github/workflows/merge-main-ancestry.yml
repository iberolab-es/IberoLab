name: Merge current main ancestry

# Temporary one-shot workflow; removed before merge.
on:
  push:
    branches: [feat/public-academic-presence]
    paths:
      - .github/workflows/merge-main-ancestry.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-ancestry:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out working branch
        uses: actions/checkout@v6
        with:
          ref: feat/public-academic-presence
          fetch-depth: 0

      - name: Record current main as merged without changing reconciled files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff -s ours origin/main -m "Integrar ascendencia de main tras reconciliación"
          git push origin HEAD:feat/public-academic-presence
