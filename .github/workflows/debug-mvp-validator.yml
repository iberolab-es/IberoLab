name: Debug MVP validator

on:
  push:
    branches: [feat/mvp-short-converter]
    paths:
      - .github/workflows/debug-mvp-validator.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/debug-mvp-validator.yml
      - scripts/validate_mvp_converter.py
      - docs/convertir.html
      - docs/mvp-converter.js

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out working branch
        uses: actions/checkout@v6
        with:
          ref: feat/mvp-short-converter

      - name: Run validator and capture output
        id: validate
        shell: bash
        run: |
          set +e
          python scripts/validate_mvp_converter.py > mvp-validator.log 2>&1
          status=$?
          cat mvp-validator.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload validator output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp-validator-log
          path: mvp-validator.log
          retention-days: 2

      - name: Preserve validator status
        if: steps.validate.outputs.status != '0'
        run: exit 1
