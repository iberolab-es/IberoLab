name: Integrate local reference SVGs

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/vendor_reference_svgs.py
      - scripts/integrate_local_assets.py
      - scripts/validate_local_assets.py
      - .github/workflows/vendor-reference-svgs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feat/vendor-reference-svgs'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/vendor-reference-svgs
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure the 18 controlled SVG resources exist
        shell: bash
        run: |
          set -euo pipefail
          count="$(find docs/assets/signs/northeastern-dual -maxdepth 1 -type f -name '*.svg' 2>/dev/null | wc -l)"
          if [[ -f data/signs/reference-standard-dual.assets.v1.json && "$count" -eq 18 ]]; then
            echo "Reusing 18 already vendored SVG resources."
          else
            python scripts/vendor_reference_svgs.py
          fi

      - name: Switch the public renderer to local assets
        run: python scripts/integrate_local_assets.py

      - name: Validate local SVG integrity and provenance
        run: python scripts/validate_local_assets.py

      - name: Run the existing project validations
        run: |
          python scripts/validate_corpus.py
          python scripts/validate_source_audit.py
          python scripts/validate_renderer.py
          python scripts/validate_browser_matrix.py
          git diff --check

      - name: Commit the local-only integration to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            data/signs/reference-standard-dual.v1.json \
            data/tests/browser-matrix.v1.json \
            docs/index.html \
            docs/test.html \
            docs/TESTING.md
          if git diff --cached --quiet; then
            echo "No integration changes to commit."
            exit 0
          fi
          git commit -m "Use repository-local SVG assets [skip ci]"
          git push origin HEAD:feat/vendor-reference-svgs
