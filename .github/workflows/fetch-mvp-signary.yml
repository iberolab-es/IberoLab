name: Fetch MVP standard signary

on:
  push:
    branches: [feat/mvp-short-converter]
    paths:
      - .github/workflows/fetch-mvp-signary.yml
      - scripts/fetch_mvp_signary.py
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/fetch-mvp-signary.yml
      - scripts/fetch_mvp_signary.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-standard-signary:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out working branch
        uses: actions/checkout@v6
        with:
          ref: feat/mvp-short-converter

      - name: Download missing CC0 SVGs and build the separate MVP manifest
        id: fetch
        shell: bash
        run: |
          set +e
          python -u scripts/fetch_mvp_signary.py > fetch-mvp-signary.log 2>&1
          status=$?
          cat fetch-mvp-signary.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload fetch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp-signary-fetch-log
          path: fetch-mvp-signary.log
          if-no-files-found: error
          retention-days: 3

      - name: Commit generated assets
        if: steps.fetch.outputs.status == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/signs/northeastern-dual data/signs/mvp-standard-signary.assets.v1.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Integrar el signario normalizado completo para el MVP"
            git push origin HEAD:feat/mvp-short-converter
          fi

      - name: Fail when generation failed
        if: steps.fetch.outputs.status != '0'
        run: exit 1
