name: Reconcile public presence with main

# Temporary one-shot workflow; removed before merge.
on:
  push:
    branches: [feat/public-academic-presence]
    paths:
      - scripts/reconcile_public_with_main.py
      - .github/workflows/reconcile-public-with-main.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out working branch
        uses: actions/checkout@v6
        with:
          ref: feat/public-academic-presence
          fetch-depth: 0

      - name: Restore conflicting files from current main
        run: |
          git fetch origin main
          git checkout origin/main -- CHANGELOG.md docs/convertir.html tests/browser/browser-smoke.spec.cjs

      - name: Reapply public changes
        run: python scripts/reconcile_public_with_main.py

      - name: Commit reconciled files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md docs/convertir.html tests/browser/browser-smoke.spec.cjs
          git commit -m "Reconciliar presencia pública con historial local"
          git push origin HEAD:feat/public-academic-presence
