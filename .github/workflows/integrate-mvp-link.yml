name: Integrate MVP link

on:
  push:
    branches: [feat/mvp-short-converter]
    paths:
      - .github/workflows/integrate-mvp-link.yml
      - scripts/integrate_mvp_link.py

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out working branch
        uses: actions/checkout@v6
        with:
          ref: feat/mvp-short-converter

      - name: Insert the MVP callout
        run: python scripts/integrate_mvp_link.py

      - name: Commit the updated corpus page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Enlazar el corpus con el demostrador MVP"
            git push origin HEAD:feat/mvp-short-converter
          fi
