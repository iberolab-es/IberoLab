name: Integrate resolved nasal m1

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/vendor_nasal_m1.py
      - scripts/apply_nasal_resolution.py
      - .github/workflows/vendor-nasal-m1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-m1:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feat/resolve-nasal-m1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/resolve-nasal-m1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Ensure the controlled m1 asset exists
        run: |
          if [[ -f docs/assets/signs/northeastern-dual/variant-m1-nasal.svg ]]; then
            echo "Reusing the already vendored m1 asset."
          else
            python scripts/vendor_nasal_m1.py
          fi

      - name: Apply the scholarly m1 to ń resolution
        run: python scripts/apply_nasal_resolution.py

      - name: Validate generated state
        run: |
          test -f docs/assets/signs/northeastern-dual/variant-m1-nasal.svg
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('data/signs/reference-standard-dual.assets.v1.json').read_text())
          mapping = json.loads(Path('data/signs/reference-standard-dual.v1.json').read_text())
          assert manifest['asset_count'] == 19
          assert manifest['unresolved'] == []
          nasal = next(item for item in mapping['signs'] if item['token'] == 'ń')
          assert nasal['paleographic_variant'] == 'm1'
          assert nasal['traditional_transcription'] == 'm'
          assert nasal['project_transcription'] == 'ń'
          assert nasal['local_path'].endswith('variant-m1-nasal.svg')
          PY
          git diff --check

      - name: Commit generated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            data/audits/source-review.v1.json \
            data/signs/reference-standard-dual.v1.json \
            data/signs/reference-standard-dual.assets.v1.json \
            data/tests/browser-matrix.v1.json \
            docs/index.html docs/test.html docs/TESTING.md docs/ASSET_PROVENANCE.md \
            tests/browser/browser-smoke.spec.cjs \
            ROADMAP.md CHANGELOG.md NOTICE \
            docs/assets/signs/northeastern-dual/variant-m1-nasal.svg
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Resolve ń through documented m1 variant [skip ci]"
          git push origin HEAD:feat/resolve-nasal-m1
