name: Apply private local history

# Temporary one-shot workflow; removed before merge.
on:
  push:
    branches: [feat/local-history]
    paths:
      - scripts/apply_local_history.py
      - .github/workflows/apply-local-history.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out working branch
        uses: actions/checkout@v6
        with:
          ref: feat/local-history

      - name: Apply local history
        run: python scripts/apply_local_history.py

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/convertir.html scripts/validate_mvp_converter.py tests/browser/browser-smoke.spec.cjs CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Añadir historial local privado"
            git push origin HEAD:feat/local-history
          fi
