name: Browser smoke tests

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - tests/browser/**
      - playwright.config.cjs
      - .github/workflows/browser-smoke.yml
  pull_request:
    branches: [main]
    paths:
      - docs/**
      - tests/browser/**
      - playwright.config.cjs
      - .github/workflows/browser-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install pinned Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.62.0

      - name: Install Chromium, Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser smoke tests
        run: npx playwright test
        env:
          CI: "true"

      - name: Upload failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: browser-smoke-failure-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
