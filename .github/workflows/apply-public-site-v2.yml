name: Apply public site v2

# Temporary one-shot workflow; removed before merge.
on:
  push:
    branches: [feat/public-site-v2]
    paths:
      - scripts/apply_public_site_v2.py
      - .github/workflows/apply-public-site-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/public-site-v2
      - run: python scripts/apply_public_site_v2.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/convertir.html scripts/validate_mvp_converter.py .github/workflows/validate.yml CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Integrar portada, historia y lectura aproximada"
            git push origin HEAD:feat/public-site-v2
          fi
