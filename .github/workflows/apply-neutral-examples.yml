name: Apply neutral MVP examples

on:
  push:
    branches: [chore/neutral-public-examples]
    paths:
      - scripts/update_public_examples.py
      - .github/workflows/apply-neutral-examples.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out working branch
        uses: actions/checkout@v6
        with:
          ref: chore/neutral-public-examples

      - name: Apply neutral examples
        run: python scripts/update_public_examples.py

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/convertir.html tests/browser/browser-smoke.spec.cjs scripts/validate_mvp_converter.py data/engine/mvp-short-converter.v1.json CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Sustituir ejemplos personales por ejemplos neutros"
            git push origin HEAD:chore/neutral-public-examples
          fi
