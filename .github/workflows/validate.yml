name: Validate IberoLab

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate attested corpus
        run: python scripts/validate_corpus.py

      - name: Validate scholarly source audit
        run: python scripts/validate_source_audit.py

      - name: Validate local SVG integrity and provenance
        run: python scripts/validate_local_assets.py

      - name: Validate reference renderer
        run: python scripts/validate_renderer.py

      - name: Validate browser matrix and self-test
        run: python scripts/validate_browser_matrix.py

      - name: Validate current project state and phase gates
        run: python scripts/validate_project_state.py

      - name: Validate specification-only phonetic engine contract
        run: python scripts/validate_engine_spec.py

      - name: Validate success and blocked execution schemas
        run: python scripts/validate_engine_schema_registry.py

      - name: Validate European Spanish pronunciation profile registry
        run: python scripts/validate_pronunciation_profiles.py

      - name: Validate practical short-input MVP converter
        run: python scripts/validate_mvp_converter.py

      - name: Validate experimental sign-reading voice
        run: python scripts/validate_experimental_voice.py

      - name: Validate public identity and academic presence
        run: python scripts/validate_public_presence.py

      - name: Validate public landing, history and approximate audio
        run: python scripts/validate_public_site.py
